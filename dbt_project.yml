name: 'lexroom_analytics'
version: '1.0.0'
config-version: 2

profile: 'lexroom_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lexroom_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  min_rated_answers_weekly: 20
  min_rated_answers_per_window: 10
  acceptance_drop_threshold_points: 20